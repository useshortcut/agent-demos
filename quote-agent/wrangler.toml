name = "shortcut-agent-service"
main = "src/index.ts"
compatibility_date = "2026-09-07"

[[kv_namespaces]]
binding = "TOKENS"
id = "your-kv-namespace-id"
preview_id = "your-kv-preview-namespace-id"

[[durable_objects.bindings]]
name = "QUOTE_DELIVERIES"
class_name = "QuoteDeliveries"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuoteDeliveries"]

[observability.logs]
enabled = true
# OAuth callback query strings contain authorization codes.
invocation_logs = false
