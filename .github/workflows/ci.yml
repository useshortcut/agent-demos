name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.demo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo: [claude-bridge, devin-bridge, estimate-guardian, openai-bridge, quote-agent, team-cop]
    defaults:
      run:
        working-directory: ${{ matrix.demo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.demo }}/package-lock.json
      - run: npm ci
      - run: npm test
      # Not required yet: the findings on the code as it stands are fixed in
      # the pull requests that follow. Delete `continue-on-error` after that.
      - name: Lint
        continue-on-error: true
        run: |
          npm ci --prefix ../lint
          PATH="$PWD/../lint/node_modules/.bin:$PATH" oxlint -c ../.oxlintrc.json --type-aware --deny-warnings src
      - name: Type check
        run: if [ -f tsconfig.json ]; then npx tsc --noEmit; else echo "no tsconfig.json; skipping"; fi
      - name: Cloudflare runtime smoke
        run: npm run test:runtime
      - name: Validate deployment bundle (no upload)
        run: npx wrangler deploy --dry-run

  lint-rules:
    name: lint rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lint/package-lock.json
      - run: npm ci
      - run: npm test
