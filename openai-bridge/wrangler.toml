name = "shortcut-openai-bridge"
main = "src/index.ts"
compatibility_date = "2026-09-07"

# Created automatically on the first deploy; no namespace IDs to paste.
[[durable_objects.bindings]]
name = "WORKSPACES"
class_name = "Workspace"

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "Session"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Workspace", "Session"]

[observability.logs]
enabled = true
# OAuth callback query strings contain authorization codes.
invocation_logs = false

# Optional. Set it to an environment template id to run each session in an
# OpenAI-hosted environment built from that template. Unset, sessions run with
# no environment.
# [vars]
# OPENAI_ENVIRONMENT_TEMPLATE_ID = "envtmpl_..."
